<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="description" content="Error del servidor en OmniStore.">
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
    

    <title>Error del Servidor (500) &middot; OmniStore</title>

    <meta name="theme-color" content="#ff5722">
    <link rel="manifest" href="./manifest.json">
</head>

<body data-page="500">
    <div class="error-layout">
        <header class="error-topbar d-flex align-items-center justify-content-between">
            <a class="auth-brand" href="./marketplace.html">
                <img src="./assets/images/logo.svg" alt="OmniStore Logo">
                <span>OmniStore</span>
            </a>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-theme-toggle aria-label="Cambiar tema">
                <i class="bi bi-sun-fill theme-icon-light"></i>
                <i class="bi bi-moon-fill theme-icon-dark d-none"></i>
            </button>
        </header>

        <main class="error-body">
            <div class="error-inner">
                <p class="error-status"><i class="bi bi-exclamation-triangle text-danger"></i> Error 500</p>
                <p class="error-code">500</p>
                <h1 class="error-title">Ocurrió un error en el servidor</h1>
                <p class="error-text">
                    El sistema ha registrado el evento. Intentar de nuevo en unos segundos suele solucionar el problema.
                </p>
                <div class="error-actions">
                    <button type="button" class="btn btn-danger" data-reload>
                        <i class="bi bi-arrow-clockwise me-1"></i> Reintentar
                    </button>
                    <a href="./marketplace.html" class="btn btn-outline-secondary"><i class="bi bi-shop me-1"></i> Ir a la Tienda</a>
                </div>
                <p class="error-meta"><i class="bi bi-clock-history"></i> Referencia <strong>OMNI-ERR-500</strong></p>
            </div>
        </main>

        <footer class="error-footer">Si el inconveniente persiste, <a href="./help.html">contacta a soporte técnico</a>.</footer>
    </div>

    <script type="module" src="./scripts/auth.js"></script>
</body>
</html>
